version: 2

sources:
  - name: raw
    schema: public
    tables:
      - name: raw_stock_daily
        description: "Raw daily stock market data; the raw layer in the ELT architecture"
        columns:
          - name: symbol
            description: "Stock code"
            data_tests:
              - not_null
          - name: trade_date
            description: "Trade date"
            data_tests:
              - not_null