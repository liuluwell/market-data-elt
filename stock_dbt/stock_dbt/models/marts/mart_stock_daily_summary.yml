version: 2

models:
  - name: mart_stock_daily_summary
    description: "Per-stock daily summary with derived metrics such as price direction and average price"
    columns:
      - name: symbol
        description: "Stock code"
        data_tests:
          - not_null
      - name: trade_date
        description: "Trade date"
        data_tests:
          - not_null
      - name: price_direction
        description: "Daily price direction"
        data_tests:
          - accepted_values:
              values: ['up', 'down', 'flat']
    data_tests:
      # Combination uniqueness: only one summary record per stock per day
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - symbol
            - trade_date